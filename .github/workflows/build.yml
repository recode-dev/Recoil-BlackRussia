name: Recoil-Br

on:
  push:
    branches: [main, test, gum]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recoil-br-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache
        uses: actions/cache@v6
        with:
          path: ~/theos
          key: theos-${{ runner.os }}-v7

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          need_install=0
          [ -f "$THEOS/makefiles/common.mk" ] || need_install=1
          [ -x "$THEOS/toolchain/linux/iphone/bin/clang" ] || need_install=1
          if [ "$need_install" = 1 ]; then
            curl -fsSL -o /tmp/theos-install https://raw.githubusercontent.com/theos/theos/master/bin/install-theos
            sed -i 's/\blibxml2\b/libxml2-16/' /tmp/theos-install
            bash /tmp/theos-install </dev/null || true
            lib="$(dpkg -L libxml2-16 2>/dev/null | grep 'libxml2\.so\.16$' | head -1 || true)"
            if [ -n "$lib" ]; then sudo ln -sf "$lib" "$(dirname "$lib")/libxml2.so.2"; fi
            [ -f "$THEOS/makefiles/common.mk" ] && [ -x "$THEOS/toolchain/linux/iphone/bin/clang" ] \
              || { echo "::error::theos core/toolchain missing after installer"; exit 1; }
          fi
          if ! ls "$THEOS"/sdks/iPhoneOS*.sdk >/dev/null 2>&1; then
            "$THEOS/bin/install-sdk" latest
          fi
          ls "$THEOS"/sdks/iPhoneOS*.sdk >/dev/null 2>&1 \
            || { echo "::error::no iPhoneOS SDK under $THEOS/sdks"; exit 1; }
          command -v ldid >/dev/null 2>&1 || sudo apt-get install -y -qq ldid || true
          make -j"$(( $(nproc) + 1 ))" ARCHS=arm64 DEBUG=0 FINALPACKAGE=1
          mkdir -p out
          dylib="$(find .theos -name Recoil-Br.dylib ! -path '*dSYM*' | head -1)"
          [ -n "$dylib" ] || { echo "Recoil-Br.dylib not found"; exit 1; }
          cp "$dylib" out/Recoil-Br.dylib
          strip -x out/Recoil-Br.dylib 2>/dev/null || true

      - name: Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Recoil-Br
          path: out/Recoil-Br.dylib

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/Recoil-Br.dylib
